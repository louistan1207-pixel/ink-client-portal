<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<title>Ink Design Studio</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F5F4F0;--surface:#FFFFFF;--border:rgba(0,0,0,0.09);--border2:rgba(0,0,0,0.18);
  --text:#1A1A1A;--text2:#666;--text3:#AAA;--accent:#1A1A1A;
  --safe-bottom:env(safe-area-inset-bottom);--safe-top:env(safe-area-inset-top);
}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;color:var(--text);overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:0 auto;position:relative}
.screen{flex:1;overflow-y:auto;padding-bottom:20px;-webkit-overflow-scrolling:touch}
.screen::-webkit-scrollbar{display:none}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:0.5px solid var(--border);padding:calc(var(--safe-top) + 12px) 18px 12px;display:flex;align-items:center;justify-content:space-between}
.brand{font-size:15px;font-weight:600;letter-spacing:0.03em}
.brand-sub{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.1em;margin-top:1px}
.avatar{width:34px;height:34px;border-radius:50%;background:#E8E6E0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--text2);flex-shrink:0}
.tabbar{width:100%;background:var(--surface);border-bottom:0.5px solid var(--border);display:flex;z-index:19;overflow-x:auto;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;cursor:pointer;color:var(--text3);font-size:10px;font-weight:500;letter-spacing:0.03em;transition:color 0.15s;min-width:70px;border-bottom:2px solid transparent}
.tab.active{color:var(--accent);border-bottom:2px solid var(--accent)}
.page{padding:18px}
.greeting{margin-bottom:18px}
.greeting-name{font-size:22px;font-weight:600;letter-spacing:-0.02em}
.greeting-sub{font-size:13px;color:var(--text2);margin-top:3px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}
.stat-card{background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:14px;cursor:pointer;transition:transform 0.1s}
.stat-card:active{transform:scale(0.97)}
.stat-label{font-size:11px;color:var(--text2);margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.stat-value{font-size:26px;font-weight:600;letter-spacing:-0.03em}
.stat-delta{font-size:10.5px;color:var(--text3);margin-top:4px}
.sec-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec-title{font-size:14px;font-weight:600}
.btn-add{display:flex;align-items:center;gap:5px;font-size:12px;padding:6px 12px;border:0.5px solid var(--border2);border-radius:20px;background:var(--surface);color:var(--text);cursor:pointer;font-family:inherit;font-weight:500}
.btn-add:active{background:var(--bg)}
.proj-card{background:var(--surface);border:0.5px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color 0.15s}
.proj-card:active{border-color:var(--border2)}
.proj-card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.proj-info{flex:1;min-width:0}
.proj-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj-client{font-size:12px;color:var(--text2);margin-top:2px}
.proj-card-meta{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.proj-stage{font-size:12px;color:var(--text2)}
.proj-date{font-size:12px;color:var(--text2)}
.prog-wrap{background:#EBEBEB;border-radius:20px;height:4px;margin-bottom:4px}
.prog-bar{height:4px;border-radius:20px;background:var(--accent);transition:width 0.3s}
.prog-label{font-size:10.5px;color:var(--text3)}
.proj-card-btns{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:0.5px solid var(--border)}
.card-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px;border-radius:10px;border:0.5px solid var(--border);background:var(--bg);font-size:12px;font-weight:500;color:var(--text2);cursor:pointer;font-family:inherit}
.card-btn:active{background:#EAEAEA}
.card-btn.danger{color:#C0392B;border-color:#F5C0BB;background:#FDF5F4}
.badge{display:inline-flex;align-items:center;font-size:10.5px;padding:3px 10px;border-radius:20px;font-weight:600}
.badge-active{background:#EAF3DE;color:#3B6D11}
.badge-review{background:#FAEEDA;color:#854F0B}
.badge-hold{background:#F1EFE8;color:#5F5E5A}
.badge-done{background:#E1F5EE;color:#0F6E56}
.activity-list{margin-bottom:10px}
.act-item{display:flex;gap:10px;padding:12px 0;border-bottom:0.5px solid var(--border)}
.act-item:first-child{padding-top:0}
.act-dot{width:6px;height:6px;border-radius:50%;background:#CCC;margin-top:5px;flex-shrink:0}
.act-body{flex:1;min-width:0}
.act-text{font-size:13px;color:var(--text2);line-height:1.5}
.act-time{font-size:11px;color:var(--text3);margin-top:2px}
.act-del{background:none;border:none;cursor:pointer;padding:4px;color:var(--text3);font-size:16px;line-height:1;flex-shrink:0}
.act-del:active{color:#C0392B}
.act-add{display:flex;gap:8px;padding-top:12px}
.act-input{flex:1;padding:10px 13px;border:0.5px solid var(--border2);border-radius:12px;font-size:13px;font-family:inherit;background:var(--surface);color:var(--text);outline:none;-webkit-appearance:none}
.act-input:focus{border-color:var(--accent)}
.btn-post{padding:10px 14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-post:active{background:#333}
.dl-card{background:var(--surface);border:0.5px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:22px}
.dl-row{display:flex;align-items:center;justify-content:space-between;padding:13px 16px;border-bottom:0.5px solid var(--border)}
.dl-row:last-child{border-bottom:none}
.dl-name{font-size:13px;font-weight:600}
.dl-stage{font-size:11px;color:var(--text2);margin-top:2px}
.dl-right{text-align:right}
.dl-date{font-size:12px;color:var(--text2)}
.dl-days-urgent{font-size:11px;color:#854F0B;margin-top:2px;font-weight:500}
.dl-days-ok{font-size:11px;color:var(--text3);margin-top:2px}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.35);z-index:50;display:flex;flex-direction:column;justify-content:flex-end;padding-bottom:65px}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;padding:0 0 calc(80px + var(--safe-bottom));max-height:85dvh;overflow-y:auto}
.sheet-handle{width:36px;height:4px;background:#DDD;border-radius:2px;margin:12px auto 0}
.sheet-title{font-size:16px;font-weight:600;padding:16px 20px 0;margin-bottom:16px}
.sheet-body{padding:0 20px}
.field{margin-bottom:14px}
.field-label{font-size:10.5px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text2);margin-bottom:6px;display:block}
.field-input,.field-select{width:100%;padding:12px 14px;border:0.5px solid var(--border2);border-radius:12px;font-size:15px;font-family:inherit;background:var(--surface);color:var(--text);outline:none;-webkit-appearance:none;appearance:none}
.field-input:focus,.field-select:focus{border-color:var(--accent)}
.field-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.range-wrap{display:flex;align-items:center;gap:12px;margin-top:6px}
.range-wrap input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:2px;background:#DDD;outline:none}
.range-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--accent)}
.range-val{font-size:15px;font-weight:600;min-width:40px;text-align:right}
.sheet-btns{display:flex;gap:10px;padding:16px 20px 0}
.btn-cancel{flex:1;padding:14px;border:0.5px solid var(--border2);border-radius:14px;background:var(--bg);color:var(--text2);font-size:15px;font-weight:500;cursor:pointer;font-family:inherit}
.btn-save{flex:2;padding:14px;border:none;border-radius:14px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-cancel:active{background:#E5E3DF}
.btn-save:active{background:#333}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--accent);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;opacity:0;transition:all 0.2s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:14px}
.sync-bar{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text3);padding:6px 18px;background:var(--surface);border-bottom:0.5px solid var(--border)}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#CCC;flex-shrink:0}
.sync-dot.synced{background:#4CAF50}
.sync-dot.syncing{background:#FF9800;animation:pulse 1s infinite}
.sync-dot.error{background:#F44336}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="brand">Ink Design Studio</div>
      <div class="brand-sub">Client Portal</div>
    </div>
    <div class="avatar">LK</div>
  </div>
  <div class="sync-bar">
    <div class="sync-dot" id="sync-dot"></div>
    <span id="sync-status">正在连接...</span>
  </div>
  <nav class="tabbar">
    <div class="tab active" data-tab="home" onclick="switchTab('home')">总览</div>
    <div class="tab" data-tab="projects" onclick="switchTab('projects')">项目</div>
    <div class="tab" data-tab="activity" onclick="switchTab('activity')">动态</div>
    <div class="tab" data-tab="deadlines" onclick="switchTab('deadlines')">到期</div>
  </nav>
  <div class="screen" id="screen"></div>
</div>
<div id="sheet-root"></div>
<div class="toast" id="toast">已同步 ✓</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDEDH9vYIzF-3XL2Xjdq9fUbG74nor824",
  authDomain: "ink-design-client-portal.firebaseapp.com",
  projectId: "ink-design-client-portal",
  storageBucket: "ink-design-client-portal.firebasestorage.app",
  messagingSenderId: "1078100053597",
  appId: "1:1078100053597:web:7dff3c0746d89e00f73db3",
  measurementId: "G-CHCJS8YX8S"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const DOC = doc(db, 'portal', 'main');

const defaults = {
  stats: {active:6, pending:3, invoiced:'48,500', completed:14},
  projects: [
    {id:1, name:'Damansara Heights Residence', client:'Tan Family', stage:'概念设计', deadline:'2026-06-15', progress:65, status:'active'},
    {id:2, name:'Bangsar South Office Fit-Out', client:'Nexus Ventures', stage:'3D 可视化', deadline:'2026-06-28', progress:40, status:'review'},
    {id:3, name:'Mont Kiara Penthouse', client:'Lim & Associates', stage:'材料选择', deadline:'2026-07-10', progress:25, status:'active'},
    {id:4, name:'Bukit Jalil Café Interior', client:'Brewed Culture', stage:'最终交接', deadline:'2026-06-05', progress:90, status:'done'},
  ],
  activities: [
    {text:'客户批准 Mont Kiara Penthouse 情绪板', time:'今天 9:14'},
    {text:'发票 #INV-2026-031 已发送给 Nexus Ventures', time:'昨天 16:50'},
    {text:'FF&E 时间表已更新 — Damansara Heights', time:'5月29日 11:00'},
    {text:'现场参观安排 — Bukit Jalil Café，6月3日', time:'5月28日 14:30'},
  ],
};

let state = JSON.parse(JSON.stringify(defaults));
let currentTab = 'home';
let isSyncing = false;

function setSyncStatus(status) {
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-status');
  dot.className = 'sync-dot ' + status;
  if(status === 'synced') label.textContent = '已同步';
  else if(status === 'syncing') label.textContent = '同步中...';
  else if(status === 'error') label.textContent = '连接失败，使用本地数据';
}

// Listen for realtime updates
onSnapshot(DOC, (snap) => {
  if(snap.exists()) {
    state = snap.data();
    setSyncStatus('synced');
    render();
  } else {
    // First time: push defaults
    setDoc(DOC, defaults).then(() => setSyncStatus('synced'));
  }
}, () => {
  setSyncStatus('error');
  render();
});

async function save() {
  setSyncStatus('syncing');
  try {
    await setDoc(DOC, state);
    setSyncStatus('synced');
    showToast();
  } catch(e) {
    setSyncStatus('error');
  }
}

function showToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}

function daysAway(d) { return Math.round((new Date(d) - new Date()) / 86400000); }
function nowStr() { const n = new Date(); return '今天 '+n.getHours()+':'+String(n.getMinutes()).padStart(2,'0'); }

window.switchTab = function(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  render();
};

const badges = {
  active:{cls:'badge-active',label:'进行中'},
  review:{cls:'badge-review',label:'审核中'},
  hold:{cls:'badge-hold',label:'暂停'},
  done:{cls:'badge-done',label:'收尾中'},
};

function render() {
  const s = document.getElementById('screen');
  if(currentTab==='home') s.innerHTML = renderHome();
  else if(currentTab==='projects') s.innerHTML = renderProjects();
  else if(currentTab==='activity') s.innerHTML = renderActivity();
  else if(currentTab==='deadlines') s.innerHTML = renderDeadlines();
}

function renderHome() {
  const upcoming = [...state.projects].sort((a,b)=>new Date(a.deadline)-new Date(b.deadline)).slice(0,2);
  return `<div class="page">
    <div class="greeting">
      <div class="greeting-name">早上好，Louis 👋</div>
      <div class="greeting-sub">本周 ${state.projects.filter(p=>p.status!=='done').length} 个进行中项目</div>
    </div>
    <div class="stats-grid">
      <div class="stat-card" onclick="openStatSheet('active')">
        <div class="stat-label">进行中 ✏️</div>
        <div class="stat-value">${state.stats.active}</div>
        <div class="stat-delta">点击更新</div>
      </div>
      <div class="stat-card" onclick="openStatSheet('pending')">
        <div class="stat-label">待审批 ✏️</div>
        <div class="stat-value">${state.stats.pending}</div>
        <div class="stat-delta">点击更新</div>
      </div>
      <div class="stat-card" onclick="openStatSheet('invoiced')">
        <div class="stat-label">已开票 MYR ✏️</div>
        <div class="stat-value" style="font-size:20px">${state.stats.invoiced}</div>
        <div class="stat-delta">点击更新</div>
      </div>
      <div class="stat-card" onclick="openStatSheet('completed')">
        <div class="stat-label">已完成 ✏️</div>
        <div class="stat-value">${state.stats.completed}</div>
        <div class="stat-delta">自 2025 年起</div>
      </div>
    </div>
    <div class="sec-header"><div class="sec-title">即将到期</div></div>
    <div class="dl-card">
      ${upcoming.map(p => {
        const d = daysAway(p.deadline);
        return `<div class="dl-row">
          <div><div class="dl-name">${p.name.split(' ').slice(0,2).join(' ')}</div><div class="dl-stage">${p.stage}</div></div>
          <div class="dl-right"><div class="dl-date">${p.deadline}</div><div class="${d<=7?'dl-days-urgent':'dl-days-ok'}">${d} 天后</div></div>
        </div>`;
      }).join('')}
    </div>
    <div class="sec-header"><div class="sec-title">最新动态</div></div>
    ${state.activities.slice(0,3).map(a=>`
    <div class="act-item" style="padding:12px 0;border-bottom:0.5px solid var(--border)">
      <div class="act-dot"></div>
      <div class="act-body"><div class="act-text">${a.text}</div><div class="act-time">${a.time}</div></div>
    </div>`).join('')}
  </div>`;
}

function renderProjects() {
  return `<div class="page">
    <div class="sec-header">
      <div class="sec-title">所有项目</div>
      <button class="btn-add" onclick="openProjectSheet(null)">＋ 新增</button>
    </div>
    ${state.projects.length===0?'<div class="empty">暂无项目</div>':''}
    ${state.projects.map(p=>`
    <div class="proj-card">
      <div class="proj-card-top">
        <div class="proj-info">
          <div class="proj-name">${p.name}</div>
          <div class="proj-client">${p.client}</div>
        </div>
        <span class="badge ${badges[p.status].cls}" style="margin-left:10px;flex-shrink:0">${badges[p.status].label}</span>
      </div>
      <div class="proj-card-meta">
        <div class="proj-stage">${p.stage}</div>
        <div class="proj-date">📅 ${p.deadline}</div>
      </div>
      <div class="prog-wrap"><div class="prog-bar" style="width:${p.progress}%"></div></div>
      <div class="prog-label">${p.progress}% 完成</div>
      <div class="proj-card-btns">
        <button class="card-btn" onclick="openProjectSheet(${p.id})">✏️ 编辑</button>
        <button class="card-btn danger" onclick="delProject(${p.id})">🗑 删除</button>
      </div>
    </div>`).join('')}
  </div>`;
}

function renderActivity() {
  return `<div class="page">
    <div class="sec-header"><div class="sec-title">最近动态</div></div>
    <div class="activity-list">
      ${state.activities.map((a,i)=>`
      <div class="act-item">
        <div class="act-dot"></div>
        <div class="act-body"><div class="act-text">${a.text}</div><div class="act-time">${a.time}</div></div>
        <button class="act-del" onclick="delActivity(${i})">✕</button>
      </div>`).join('')}
    </div>
    <div class="act-add">
      <input class="act-input" id="act-input" placeholder="输入新动态..."/>
      <button class="btn-post" onclick="addActivity()">发布</button>
    </div>
  </div>`;
}

function renderDeadlines() {
  const sorted = [...state.projects].sort((a,b)=>new Date(a.deadline)-new Date(b.deadline));
  return `<div class="page">
    <div class="sec-header"><div class="sec-title">截止日期</div></div>
    <div class="dl-card">
      ${sorted.map(p=>{
        const d = daysAway(p.deadline);
        return `<div class="dl-row">
          <div>
            <div class="dl-name">${p.name.split(' ').slice(0,3).join(' ')}</div>
            <div class="dl-stage">${p.stage} · <span class="badge ${badges[p.status].cls}" style="font-size:9.5px;padding:2px 7px">${badges[p.status].label}</span></div>
          </div>
          <div class="dl-right">
            <div class="dl-date">${p.deadline}</div>
            <div class="${d<=7?'dl-days-urgent':'dl-days-ok'}">${d} 天后</div>
          </div>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

window.openStatSheet = function(key) {
  const labels = {active:'进行中项目',pending:'待审批',invoiced:'已开票 (MYR)',completed:'已完成'};
  document.getElementById('sheet-root').innerHTML = `
    <div class="sheet-overlay" onclick="if(event.target===this)closeSheet()">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">更新 — ${labels[key]}</div>
        <div class="sheet-body">
          <div class="field">
            <label class="field-label">新数值</label>
            <input class="field-input" id="f-stat" value="${state.stats[key]}" inputmode="decimal"/>
          </div>
        </div>
        <div class="sheet-btns">
          <button class="btn-cancel" onclick="closeSheet()">取消</button>
          <button class="btn-save" onclick="saveStat('${key}')">保存</button>
        </div>
      </div>
    </div>`;
  setTimeout(()=>document.getElementById('f-stat').focus(),100);
};
window.saveStat = function(key) {
  state.stats[key] = document.getElementById('f-stat').value;
  save(); closeSheet(); render();
};

window.openProjectSheet = function(id) {
  const p = id ? state.projects.find(x=>x.id===id) : {id:0,name:'',client:'',stage:'',deadline:'',progress:0,status:'active'};
  document.getElementById('sheet-root').innerHTML = `
    <div class="sheet-overlay" onclick="if(event.target===this)closeSheet()">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">${id?'编辑项目':'新增项目'}</div>
        <div class="sheet-body">
          <div class="field"><label class="field-label">项目名称</label><input class="field-input" id="f-name" value="${p.name}" placeholder="项目名称"/></div>
          <div class="field"><label class="field-label">客户</label><input class="field-input" id="f-client" value="${p.client}" placeholder="客户名称"/></div>
          <div class="field-row2">
            <div class="field"><label class="field-label">当前阶段</label><input class="field-input" id="f-stage" value="${p.stage}" placeholder="例：概念设计"/></div>
            <div class="field"><label class="field-label">截止日期</label><input class="field-input" id="f-deadline" type="date" value="${p.deadline}"/></div>
          </div>
          <div class="field">
            <label class="field-label">进度</label>
            <div class="range-wrap">
              <input type="range" min="0" max="100" step="1" value="${p.progress}" id="f-prog" oninput="document.getElementById('rv').textContent=this.value+'%'"/>
              <div class="range-val" id="rv">${p.progress}%</div>
            </div>
          </div>
          <div class="field">
            <label class="field-label">状态</label>
            <select class="field-select" id="f-status">
              <option value="active" ${p.status==='active'?'selected':''}>进行中</option>
              <option value="review" ${p.status==='review'?'selected':''}>审核中</option>
              <option value="hold" ${p.status==='hold'?'selected':''}>暂停</option>
              <option value="done" ${p.status==='done'?'selected':''}>收尾中</option>
            </select>
          </div>
        </div>
        <div class="sheet-btns">
          <button class="btn-cancel" onclick="closeSheet()">取消</button>
          <button class="btn-save" onclick="saveProject(${p.id})">${id?'保存':'添加'}</button>
        </div>
      </div>
    </div>`;
};
window.saveProject = function(id) {
  const proj = {
    id: id||Date.now(),
    name: document.getElementById('f-name').value.trim(),
    client: document.getElementById('f-client').value.trim(),
    stage: document.getElementById('f-stage').value.trim(),
    deadline: document.getElementById('f-deadline').value,
    progress: parseInt(document.getElementById('f-prog').value),
    status: document.getElementById('f-status').value,
  };
  if(id){const i=state.projects.findIndex(x=>x.id===id);state.projects[i]=proj;}
  else state.projects.push(proj);
  state.stats.active = state.projects.filter(p=>p.status!=='done').length;
  save(); closeSheet(); render();
};
window.delProject = function(id) {
  if(!confirm('确定删除此项目？')) return;
  state.projects = state.projects.filter(p=>p.id!==id);
  state.stats.active = state.projects.filter(p=>p.status!=='done').length;
  save(); render();
};
window.addActivity = function() {
  const input = document.getElementById('act-input');
  const txt = input.value.trim();
  if(!txt) return;
  state.activities.unshift({text:txt, time:nowStr()});
  save(); render();
};
window.delActivity = function(i) {
  state.activities.splice(i,1);
  save(); render();
};
window.closeSheet = function() { document.getElementById('sheet-root').innerHTML=''; };

render();
</script>
</body>
</html>
